<script>
// ========== グローバル状態 ==========
let currentToken = null;
let currentUser = null;
let currentPage = 'login';
let shiftOptions = [];
let activePopup = null;

// ========== 初期化 ==========
document.addEventListener('DOMContentLoaded', function() {
  // セッション復元
  currentToken = sessionStorage.getItem('token');
  const savedUser = sessionStorage.getItem('user');
  if (currentToken && savedUser) {
    currentUser = JSON.parse(savedUser);
    showApp();
  }

  // Enterキーでログイン
  document.getElementById('login-password').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') doLogin();
  });
  document.getElementById('login-id').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') document.getElementById('login-password').focus();
  });

  // ポップアップ外クリックで閉じる
  document.addEventListener('click', function(e) {
    if (activePopup && !e.target.closest('.shift-popup') && !e.target.closest('.shift-cell')) {
      closeShiftPopup();
    }
  });

  // 祝日ドラッグ&ドロップ
  setupHolidayDropZone();
});

// ========== 認証 ==========
function doLogin() {
  const id = String(document.getElementById('login-id').value).trim();
  const pw = String(document.getElementById('login-password').value);
  if (!id || !pw) {
    showError('login-error', '社員番号とパスワードを入力してください');
    return;
  }
  showLoading();
  google.script.run
    .withSuccessHandler(function(result) {
      hideLoading();
      if (result.success) {
        currentToken = result.token;
        currentUser = result.user;
        // employeeIdを文字列として保持
        currentUser.employeeId = String(currentUser.employeeId);
        sessionStorage.setItem('token', currentToken);
        sessionStorage.setItem('user', JSON.stringify(currentUser));
        showApp();
      } else {
        showError('login-error', result.message);
      }
    })
    .withFailureHandler(function(err) {
      hideLoading();
      showError('login-error', 'ログインに失敗しました: ' + err.message);
    })
    .login(String(id), String(pw));
}

function doLogout() {
  google.script.run.logout(currentToken);
  currentToken = null;
  currentUser = null;
  sessionStorage.removeItem('token');
  sessionStorage.removeItem('user');
  document.getElementById('app-header').style.display = 'none';
  showPage('login');
}

function showApp() {
  document.getElementById('app-header').style.display = 'block';
  document.getElementById('header-user-name').textContent = currentUser.name + 'さん';

  if (currentUser.role === 'admin') {
    document.getElementById('admin-nav').style.display = 'inline-flex';
  } else {
    document.getElementById('admin-nav').style.display = 'none';
  }

  navigateTo('shift-input');
}

// ========== パスワード変更 ==========
function showPasswordChange() {
  document.getElementById('pw-current').value = '';
  document.getElementById('pw-new').value = '';
  document.getElementById('pw-confirm').value = '';
  hideError('pw-error');
  document.getElementById('modal-password').style.display = 'flex';
}

function doChangePassword() {
  const current = document.getElementById('pw-current').value;
  const newPw = document.getElementById('pw-new').value;
  const confirm = document.getElementById('pw-confirm').value;

  if (!current || !newPw) {
    showError('pw-error', '全項目を入力してください');
    return;
  }
  if (newPw !== confirm) {
    showError('pw-error', '新しいパスワードが一致しません');
    return;
  }
  if (newPw.length < 4) {
    showError('pw-error', 'パスワードは4文字以上で設定してください');
    return;
  }

  showLoading();
  google.script.run
    .withSuccessHandler(function(result) {
      hideLoading();
      if (result.success) {
        closeModal('modal-password');
        showToast(result.message, 'success');
      } else {
        showError('pw-error', result.message);
      }
    })
    .withFailureHandler(handleError)
    .changePassword(currentToken, current, newPw);
}

// ========== ナビゲーション ==========
function navigateTo(page) {
  currentPage = page;
  // ナビボタンのactive切り替え
  document.querySelectorAll('.nav-btn').forEach(function(btn) {
    btn.classList.toggle('active', btn.dataset.page === page);
  });
  showPage(page);
  // ページ読み込み
  loadPageData(page);
}

function showPage(page) {
  document.querySelectorAll('.page').forEach(function(p) {
    p.style.display = 'none';
  });
  document.getElementById('page-' + page).style.display = 'block';
}

function loadPageData(page) {
  switch (page) {
    case 'shift-input':
      initMonthSelector('input');
      break;
    case 'shift-view':
      initMonthSelector('view');
      break;
    case 'admin-users':
      loadAdminUsers();
      break;
    case 'admin-month':
      loadMonthDefs();
      break;
    case 'admin-holidays-req':
      loadReqHolidays();
      break;
    case 'admin-holidays':
      loadHolidays();
      break;
    case 'admin-options':
      loadShiftOptions();
      break;
    case 'admin-defaults':
      loadUserDefaults();
      break;
    case 'admin-announcements':
      loadAnnouncements();
      break;
    case 'admin-locks':
      loadLocks();
      break;
    case 'admin-final':
      initMonthSelector('final');
      break;
    case 'admin-export':
      initMonthSelector('export');
      break;
  }
}

// ========== 月度セレクタ ==========
function initMonthSelector(prefix) {
  google.script.run
    .withSuccessHandler(function(result) {
      if (!result.success) return;
      var select = document.getElementById(prefix + '-month-select');
      select.innerHTML = '';
      result.months.forEach(function(m) {
        var opt = document.createElement('option');
        opt.value = m.yearMonth;
        opt.textContent = m.label + (m.locked ? ' [締切済]' : '');
        select.appendChild(opt);
      });
      // デフォルト選択: input/final→最新締切後の月度, view→最新締切済み月度
      var defaultYM = null;
      if (prefix === 'view') {
        // 閲覧: 最新の締切済み月度
        for (var mi = result.months.length - 1; mi >= 0; mi--) {
          if (result.months[mi].locked) { defaultYM = result.months[mi].yearMonth; break; }
        }
      } else {
        // 入力/確定: 締切済みの次の月度
        for (var mi = 0; mi < result.months.length; mi++) {
          if (!result.months[mi].locked) { defaultYM = result.months[mi].yearMonth; break; }
        }
      }
      if (defaultYM && select.querySelector('option[value="' + defaultYM + '"]')) {
        select.value = defaultYM;
      }
      // ページデータ読み込み
      switch (prefix) {
        case 'input': loadShiftInput(); break;
        case 'view': loadShiftView(); break;
        case 'final': loadFinalShift(); break;
        case 'export': break;
      }
    })
    .withFailureHandler(handleError)
    .apiGetAvailableYearMonths(currentToken);
}

function changeMonth(prefix, delta) {
  var select = document.getElementById(prefix + '-month-select');
  var idx = select.selectedIndex + delta;
  if (idx >= 0 && idx < select.options.length) {
    select.selectedIndex = idx;
    switch (prefix) {
      case 'input': loadShiftInput(); break;
      case 'view': loadShiftView(); break;
      case 'final': loadFinalShift(); break;
    }
  }
}

// ========== 希望シフト入力 ==========
function loadShiftInput() {
  var yearMonth = document.getElementById('input-month-select').value;
  if (!yearMonth) return;

  document.getElementById('shift-input-table-container').innerHTML = '<div class="loading">読み込み中...</div>';

  google.script.run
    .withSuccessHandler(function(data) {
      if (!data.success) {
        document.getElementById('shift-input-table-container').innerHTML =
          '<div class="notice notice-danger">' + data.message + '</div>';
        return;
      }
      shiftOptions = data.options;

      // 管理者のみ「デフォルトから反映」ボタンを表示
      var genBtn = document.getElementById('btn-generate-requests');
      genBtn.style.display = data.isAdmin ? 'inline-block' : 'none';

      // デフォルト未反映の通知
      var defaultsNotice = document.getElementById('input-defaults-notice');
      if (!data.defaultsGenerated && !data.isAdmin) {
        defaultsNotice.style.display = 'block';
      } else {
        defaultsNotice.style.display = 'none';
      }

      // 周知事項表示
      var annoEl = document.getElementById('input-announcement');
      if (data.announcement) {
        annoEl.textContent = data.announcement;
        annoEl.style.display = 'block';
      } else {
        annoEl.style.display = 'none';
      }

      renderShiftInputTable(data);
      updateDaysOffInfo(yearMonth);
    })
    .withFailureHandler(handleError)
    .apiGetShiftInputData(currentToken, yearMonth);
}

function renderShiftInputTable(data) {
  var dates = generateDates(data.dateRange.startDate, data.dateRange.endDate);
  var optionMap = {};
  data.options.forEach(function(o) { optionMap[o.optionId] = o; });

  // 締切通知
  var lockNotice = document.getElementById('input-lock-notice');
  lockNotice.style.display = (data.locked && !data.isAdmin) ? 'block' : 'none';

  // デフォルト未反映なら一般ユーザーは編集不可
  var editable = (data.defaultsGenerated || data.isAdmin) && (!data.locked || data.isAdmin);

  // ユーザーリスト（本人を最上段に）
  var myId = currentUser.employeeId;
  var sortedUsers = data.users.slice();
  sortedUsers.sort(function(a, b) {
    if (String(a.employeeId) === String(myId)) return -1;
    if (String(b.employeeId) === String(myId)) return 1;
    return 0;
  });

  // リクエストをマップ化
  var requestMap = {};
  data.myRequests.concat(data.otherRequests).forEach(function(r) {
    requestMap[r.employeeId + '_' + r.date] = r.shiftOptionId;
  });

  // デフォルトとの差分マップ構築
  var allDefaults = data.allDefaults || {};
  var holidaySet = {};
  data.holidays.forEach(function(h) { holidaySet[h] = true; });

  var html = '<table><thead><tr><th class="sticky-col">氏名</th>';
  dates.forEach(function(d) {
    var dt = new Date(d);
    var dayNames = ['日','月','火','水','木','金','土'];
    var dayClass = '';
    if (dt.getDay() === 0) dayClass = 'col-sun';
    else if (dt.getDay() === 6) dayClass = 'col-sat';
    if (data.holidays.includes(d)) dayClass = 'col-holiday';
    html += '<th class="' + dayClass + '">' + dayNames[dt.getDay()] + '<br>' +
            (dt.getMonth() + 1) + '/' + dt.getDate() + '</th>';
  });
  html += '</tr></thead><tbody>';

  sortedUsers.forEach(function(user) {
    var isMe = String(user.employeeId) === String(myId);
    html += '<tr>';
    html += '<td class="sticky-col' + (isMe ? ' my-row' : '') + '">' +
            user.name + (isMe ? ' (自分)' : '') + '</td>';

    dates.forEach(function(d) {
      var dt = new Date(d);
      var dayClass = '';
      if (dt.getDay() === 0) dayClass = 'col-sun';
      else if (dt.getDay() === 6) dayClass = 'col-sat';
      if (data.holidays.includes(d)) dayClass = 'col-holiday';

      var optId = requestMap[user.employeeId + '_' + d] || '';
      var label = '';
      var cellClass = 'shift-cell';
      if (optId && optionMap[optId]) {
        var opt = optionMap[optId];
        if (opt.startTime && opt.endTime) {
          label = opt.startTime + '-' + opt.endTime;
          cellClass += ' has-shift';
        } else if (opt.label.includes('公休')) {
          label = '休';
          cellClass += ' is-off';
        } else if (opt.label.includes('有休')) {
          label = '有休';
          cellClass += ' is-paid-leave';
        } else {
          label = opt.label;
        }
      }

      // デフォルトとの差分チェック
      var diffClass = '';
      if (isMe && allDefaults[myId]) {
        var myDef = allDefaults[myId];
        var expectedOpt = myDef[String(dt.getDay())] || '';
        if (optId !== expectedOpt) {
          diffClass = ' diff-from-default';
        }
      }

      if (isMe && editable) {
        html += '<td class="' + cellClass + diffClass + ' ' + dayClass + (isMe ? ' my-row' : '') +
                '" data-date="' + d + '" data-opt="' + optId +
                '" onclick="openShiftPopup(this, \'' + data.yearMonth + '\', \'' + d + '\')">' +
                label + '</td>';
      } else {
        html += '<td class="' + cellClass + diffClass + ' ' + dayClass + (isMe ? ' my-row' : '') +
                '">' + label + '</td>';
      }
    });
    html += '</tr>';
  });

  html += '</tbody></table>';
  document.getElementById('shift-input-table-container').innerHTML = html;
}

function openShiftPopup(cell, yearMonth, date) {
  closeShiftPopup();

  var rect = cell.getBoundingClientRect();
  var popup = document.createElement('div');
  popup.className = 'shift-popup';
  popup.style.position = 'fixed';
  popup.style.top = (rect.bottom + 2) + 'px';
  popup.style.left = rect.left + 'px';

  var currentOpt = cell.dataset.opt;

  shiftOptions.forEach(function(opt) {
    var btn = document.createElement('button');
    var displayLabel = opt.label;
    if (opt.startTime && opt.endTime) {
      displayLabel = opt.startTime + '-' + opt.endTime;
    }
    btn.textContent = displayLabel;
    if (opt.optionId === currentOpt) btn.className = 'selected';
    btn.onclick = function() {
      saveShiftCell(cell, yearMonth, date, opt.optionId, opt);
      closeShiftPopup();
    };
    popup.appendChild(btn);
  });

  // クリアボタン
  var clearBtn = document.createElement('button');
  clearBtn.textContent = 'クリア';
  clearBtn.className = 'popup-clear';
  clearBtn.onclick = function() {
    saveShiftCell(cell, yearMonth, date, '', null);
    closeShiftPopup();
  };
  popup.appendChild(clearBtn);

  document.body.appendChild(popup);
  activePopup = popup;

  // 画面外にはみ出す場合の調整
  var popupRect = popup.getBoundingClientRect();
  if (popupRect.right > window.innerWidth) {
    popup.style.left = (window.innerWidth - popupRect.width - 10) + 'px';
  }
  if (popupRect.bottom > window.innerHeight) {
    popup.style.top = (rect.top - popupRect.height - 2) + 'px';
  }
}

function closeShiftPopup() {
  if (activePopup) {
    activePopup.remove();
    activePopup = null;
  }
}

function saveShiftCell(cell, yearMonth, date, optionId, opt) {
  // UI即時更新
  cell.dataset.opt = optionId;
  cell.className = cell.className.replace(/ has-shift| is-off| is-paid-leave/g, '');

  if (opt) {
    if (opt.startTime && opt.endTime) {
      cell.textContent = opt.startTime + '-' + opt.endTime;
      cell.classList.add('has-shift');
    } else if (opt.label.includes('公休')) {
      cell.textContent = '休';
      cell.classList.add('is-off');
    } else if (opt.label.includes('有休')) {
      cell.textContent = '有休';
      cell.classList.add('is-paid-leave');
    } else {
      cell.textContent = opt.label;
    }
  } else {
    cell.textContent = '';
  }

  // サーバー保存
  google.script.run
    .withSuccessHandler(function(result) {
      if (!result.success) {
        showToast('保存に失敗しました: ' + result.message, 'error');
        loadShiftInput(); // リロード
      } else {
        updateDaysOffInfo(yearMonth);
      }
    })
    .withFailureHandler(function(err) {
      showToast('保存エラー: ' + err.message, 'error');
    })
    .apiSaveShiftRequest(currentToken, yearMonth, date, optionId);
}

function updateDaysOffInfo(yearMonth) {
  google.script.run
    .withSuccessHandler(function(result) {
      var el = document.getElementById('input-days-off-info');
      if (!result.success || result.required === null) {
        el.style.display = 'none';
        return;
      }

      var text = '公休: ' + result.daysOffCount + '日';
      if (result.paidLeaveCount > 0) {
        text += ' / 有休: ' + result.paidLeaveCount + '日';
      }
      if (result.required !== null) {
        text += ' / 必要公休: ' + result.required + '日';
      }

      el.textContent = text;
      el.style.display = 'block';

      if (result.warning) {
        el.className = 'notice notice-warning';
        el.textContent = result.warning;
      } else {
        el.className = 'notice notice-info';
      }
    })
    .withFailureHandler(function() {})
    .apiCheckDaysOff(currentToken, yearMonth);
}

// ========== シフト閲覧 ==========
function loadShiftView() {
  var yearMonth = document.getElementById('view-month-select').value;
  if (!yearMonth) return;

  document.getElementById('shift-view-table-container').innerHTML = '<div class="loading">読み込み中...</div>';

  google.script.run
    .withSuccessHandler(function(data) {
      if (!data.success) return;

      if (!data.locked) {
        document.getElementById('shift-view-table-container').innerHTML =
          '<div class="notice notice-info">この月度はまだ締切されていません。締切後に確定シフトが表示されます。</div>';
        document.getElementById('view-source-notice').style.display = 'none';
        return;
      }

      var notice = document.getElementById('view-source-notice');
      notice.textContent = data.isFinal ? '確定シフトを表示しています' : '希望シフトを表示しています（未確定）';
      notice.style.display = 'block';

      renderShiftViewTable(data);
    })
    .withFailureHandler(handleError)
    .apiGetShiftView(currentToken, yearMonth);
}

function renderShiftViewTable(data) {
  var dates = generateDates(data.dateRange.startDate, data.dateRange.endDate);
  var optionMap = {};
  data.options.forEach(function(o) { optionMap[o.optionId] = o; });

  var shiftMap = {};
  data.shifts.forEach(function(s) {
    shiftMap[s.employeeId + '_' + s.date] = s.shiftOptionId;
  });

  var html = '<table><thead><tr><th class="sticky-col">氏名</th>';
  dates.forEach(function(d) {
    var dt = new Date(d);
    var dayNames = ['日','月','火','水','木','金','土'];
    var dayClass = '';
    if (dt.getDay() === 0) dayClass = 'col-sun';
    else if (dt.getDay() === 6) dayClass = 'col-sat';
    if (data.holidays.includes(d)) dayClass = 'col-holiday';
    html += '<th class="' + dayClass + '">' + dayNames[dt.getDay()] + '<br>' +
            (dt.getMonth() + 1) + '/' + dt.getDate() + '</th>';
  });
  html += '</tr></thead><tbody>';

  data.users.forEach(function(user) {
    var isMe = String(user.employeeId) === String(currentUser.employeeId);
    html += '<tr>';
    html += '<td class="sticky-col' + (isMe ? ' my-row' : '') + '">' + user.name + '</td>';

    dates.forEach(function(d) {
      var dt = new Date(d);
      var dayClass = '';
      if (dt.getDay() === 0) dayClass = 'col-sun';
      else if (dt.getDay() === 6) dayClass = 'col-sat';
      if (data.holidays.includes(d)) dayClass = 'col-holiday';

      var optId = shiftMap[user.employeeId + '_' + d] || '';
      var label = '';
      var cellClass = '';
      if (optId && optionMap[optId]) {
        var opt = optionMap[optId];
        if (opt.startTime && opt.endTime) {
          label = opt.startTime + '-' + opt.endTime;
          cellClass = 'has-shift';
        } else if (opt.label.includes('公休')) {
          label = '休';
          cellClass = 'is-off';
        } else if (opt.label.includes('有休')) {
          label = '有休';
          cellClass = 'is-paid-leave';
        } else {
          label = opt.label;
        }
      }
      html += '<td class="' + cellClass + ' ' + dayClass + (isMe ? ' my-row' : '') + '">' + label + '</td>';
    });
    html += '</tr>';
  });

  html += '</tbody></table>';
  document.getElementById('shift-view-table-container').innerHTML = html;
}

// ========== 管理者：ユーザー管理 ==========
function loadAdminUsers() {
  google.script.run
    .withSuccessHandler(function(result) {
      if (!result.success) return;
      renderUsersTable(result.users);
    })
    .withFailureHandler(handleError)
    .apiAdminGetUsers(currentToken);
}

function renderUsersTable(users) {
  var html = '<table class="admin-table"><thead><tr>' +
    '<th>社員番号</th><th>氏名</th><th>権限</th><th>区分</th><th>有休時間帯</th><th>有効</th><th>操作</th>' +
    '</tr></thead><tbody>';

  users.forEach(function(u) {
    html += '<tr>' +
      '<td>' + u.employeeId + '</td>' +
      '<td>' + u.name + '</td>' +
      '<td>' + (u.role === 'admin' ? '管理者' : '一般') + '</td>' +
      '<td>' + (u.category || '') + '</td>' +
      '<td>' + (u.paidLeaveStartTime && u.paidLeaveEndTime ? u.paidLeaveStartTime + '-' + u.paidLeaveEndTime : '-') + '</td>' +
      '<td>' + (u.active ? 'はい' : 'いいえ') + '</td>' +
      '<td>' +
      '<button class="btn btn-sm btn-primary" onclick="showEditUserModal(\'' + u.employeeId + '\')">編集</button> ' +
      '<button class="btn btn-sm btn-warning" onclick="resetPassword(\'' + u.employeeId + '\')">PW初期化</button> ' +
      '<button class="btn btn-sm btn-danger" onclick="deleteUserConfirm(\'' + u.employeeId + '\', \'' + u.name.replace(/'/g, "\\'") + '\')">削除</button>' +
      '</td></tr>';
  });

  html += '</tbody></table>';
  document.getElementById('users-table-container').innerHTML = html;
}

function loadPaidLeaveOptions(selectedStart, selectedEnd) {
  var select = document.getElementById('user-pl-option');
  select.innerHTML = '<option value="">-- なし --</option>';
  google.script.run
    .withSuccessHandler(function(result) {
      if (!result.success) return;
      result.options.forEach(function(o) {
        if (o.startTime && o.endTime) {
          var opt = document.createElement('option');
          opt.value = o.optionId;
          opt.dataset.start = o.startTime;
          opt.dataset.end = o.endTime;
          opt.dataset.code = o.code || '';
          opt.textContent = o.startTime + '-' + o.endTime + (o.code ? ' [' + o.code + ']' : '');
          if (selectedStart && selectedEnd && o.startTime === selectedStart && o.endTime === selectedEnd) {
            opt.selected = true;
          }
          select.appendChild(opt);
        }
      });
    })
    .withFailureHandler(function() {})
    .apiAdminGetShiftOptions(currentToken);
}

function showAddUserModal() {
  document.getElementById('modal-user-title').textContent = 'ユーザー登録';
  document.getElementById('user-employee-id').value = '';
  document.getElementById('user-employee-id').disabled = false;
  document.getElementById('user-name').value = '';
  document.getElementById('user-role').value = 'user';
  document.getElementById('user-category').value = '社員';
  document.getElementById('user-include-pl').checked = false;
  document.getElementById('user-password').value = 'password';
  document.getElementById('user-password-group').style.display = 'block';
  document.getElementById('user-active').checked = true;
  document.getElementById('user-display-order').value = '0';
  loadPaidLeaveOptions('', '');
  document.getElementById('btn-save-user').dataset.mode = 'add';
  hideError('user-error');
  document.getElementById('modal-user').style.display = 'flex';
}

function showEditUserModal(employeeId) {
  google.script.run
    .withSuccessHandler(function(result) {
      if (!result.success) return;
      var user = result.users.find(function(u) { return String(u.employeeId) === String(employeeId); });
      if (!user) return;

      document.getElementById('modal-user-title').textContent = 'ユーザー編集';
      document.getElementById('user-employee-id').value = user.employeeId;
      document.getElementById('user-employee-id').disabled = true;

function renderFinalShiftTable(data) {
  var dates = generateDates(data.dateRange.startDate, data.dateRange.endDate);
  var optionMap = {};
  data.options.forEach(function(o) { optionMap[o.optionId] = o; });

  var shiftMap = {};
  data.shifts.forEach(function(s) {
    shiftMap[s.employeeId + '_' + s.date] = s.shiftOptionId;
  });

  // ユーザーごとの公休日数を集計
  var daysOffMap = {};
  data.users.forEach(function(user) {
    var count = 0;
    dates.forEach(function(d) {
      var optId = shiftMap[user.employeeId + '_' + d] || '';
      if (optId && optionMap[optId]) {
        var lbl = optionMap[optId].label;
        if (lbl === '公休' || lbl.includes('公休')) count++;
        if (user.includePaidLeaveInDaysOff && (lbl === '有休' || lbl.includes('有休'))) count++;
      }
    });
    daysOffMap[user.employeeId] = count;
  });

  var html = '<table><thead><tr><th class="sticky-col">氏名</th>';
  dates.forEach(function(d) {
    var dt = new Date(d);
    var dayNames = ['日','月','火','水','木','金','土'];
    var dayClass = '';
    if (dt.getDay() === 0) dayClass = 'col-sun';
    else if (dt.getDay() === 6) dayClass = 'col-sat';
    if (data.holidays.includes(d)) dayClass = 'col-holiday';
    html += '<th class="' + dayClass + '">' + dayNames[dt.getDay()] + '<br>' +
            (dt.getMonth() + 1) + '/' + dt.getDate() + '</th>';
  });
  html += '</tr></thead><tbody>';

  data.users.forEach(function(user) {
    var isShainn = user.category === '社員';
    var insufficient = isShainn && data.requiredDaysOff !== null && daysOffMap[user.employeeId] < data.requiredDaysOff;
    html += '<tr>';
    html += '<td class="sticky-col' + (insufficient ? ' days-off-warning' : '') + '">' +
            user.name + (insufficient ? ' (' + daysOffMap[user.employeeId] + '/' + data.requiredDaysOff + ')' : '') + '</td>';

    dates.forEach(function(d) {
      var dt = new Date(d);
      var dayClass = '';
      if (dt.getDay() === 0) dayClass = 'col-sun';
      else if (dt.getDay() === 6) dayClass = 'col-sat';
      if (data.holidays.includes(d)) dayClass = 'col-holiday';

      var optId = shiftMap[user.employeeId + '_' + d] || '';
      var label = '';
      var cellClass = 'shift-cell';
      if (optId && optionMap[optId]) {
        var opt = optionMap[optId];
        if (opt.startTime && opt.endTime) {
          label = opt.startTime + '-' + opt.endTime;
          cellClass += ' has-shift';
        } else if (opt.label.includes('公休')) {
          label = '休';
          cellClass += ' is-off';
        } else if (opt.label.includes('有休')) {
          label = '有休';
          cellClass += ' is-paid-leave';
        } else {
          label = opt.label;
        }
      }

      var ymVal = document.getElementById('final-month-select').value;
      html += '<td class="' + cellClass + ' ' + dayClass +
              '" data-emp="' + user.employeeId + '" data-date="' + d + '" data-opt="' + optId +
              '" onclick="openFinalShiftPopup(this, \'' + ymVal + '\', \'' +
              user.employeeId + '\', \'' + d + '\')">' + label + '</td>';
    });
    html += '</tr>';
  });

  html += '</tbody></table>';
  document.getElementById('final-shift-table-container').innerHTML = html;
}

function openFinalShiftPopup(cell, yearMonth, employeeId, date) {
  closeShiftPopup();

  var rect = cell.getBoundingClientRect();
  var popup = document.createElement('div');
  popup.className = 'shift-popup';
  popup.style.position = 'fixed';
  popup.style.top = (rect.bottom + 2) + 'px';
  popup.style.left = rect.left + 'px';

  var currentOpt = cell.dataset.opt;

  shiftOptions.forEach(function(opt) {
    var btn = document.createElement('button');
    var displayLabel = opt.label;
    if (opt.startTime && opt.endTime) {
      displayLabel = opt.startTime + '-' + opt.endTime;
    }
    btn.textContent = displayLabel;
    if (opt.optionId === currentOpt) btn.className = 'selected';
    btn.onclick = function() {
      saveFinalShiftCell(cell, yearMonth, employeeId, date, opt.optionId, opt);
      closeShiftPopup();
    };
    popup.appendChild(btn);
  });

  var clearBtn = document.createElement('button');
  clearBtn.textContent = 'クリア';
  clearBtn.className = 'popup-clear';
  clearBtn.onclick = function() {
    saveFinalShiftCell(cell, yearMonth, employeeId, date, '', null);
    closeShiftPopup();
  };
  popup.appendChild(clearBtn);

  document.body.appendChild(popup);
  activePopup = popup;

  // 画面外調整
  var popupRect = popup.getBoundingClientRect();
  if (popupRect.right > window.innerWidth) {
    popup.style.left = (window.innerWidth - popupRect.width - 10) + 'px';
  }
  if (popupRect.bottom > window.innerHeight) {
    popup.style.top = (rect.top - popupRect.height - 2) + 'px';
  }
}

function saveFinalShiftCell(cell, yearMonth, employeeId, date, optionId, opt) {
  cell.dataset.opt = optionId;
  cell.className = cell.className.replace(/ has-shift| is-off| is-paid-leave/g, '');

  if (opt) {
    if (opt.startTime && opt.endTime) {
      cell.textContent = opt.startTime + '-' + opt.endTime;
      cell.classList.add('has-shift');
    } else if (opt.label.includes('公休')) {
      cell.textContent = '休';
      cell.classList.add('is-off');
    } else if (opt.label.includes('有休')) {
      cell.textContent = '有休';
      cell.classList.add('is-paid-leave');
    } else {
      cell.textContent = opt.label;
    }
  } else {
    cell.textContent = '';
  }

  google.script.run
    .withSuccessHandler(function(result) {
      if (!result.success) {
        showToast('保存に失敗しました', 'error');
        loadFinalShift();
      }
    })
    .withFailureHandler(function(err) {
      showToast('保存エラー: ' + err.message, 'error');
    })
    .apiAdminSaveShiftFinal(currentToken, yearMonth, employeeId, date, optionId);
}

  html += '<th>操作</th></tr></thead><tbody>';

  users.forEach(function(user) {
    var empId = String(user.employeeId);
    var userDefaults = allDefaults[empId] || {};

    html += '<tr>';
    html += '<td>' + user.name + '</td>';

    for (var d = 0; d < 7; d++) {
      var currentOpt = userDefaults[String(d)] || '';
      var cls = '';
      if (d === 0) cls = ' col-sun';
      else if (d === 6) cls = ' col-sat';

      html += '<td class="' + cls + '"><select class="default-select" data-emp="' + empId +
              '" data-day="' + d + '">';
      html += '<option value="">--</option>';
      options.forEach(function(opt) {
        var label = opt.label;
        if (opt.startTime && opt.endTime) {
          label = opt.startTime + '-' + opt.endTime;
        }
        var selected = (opt.optionId === currentOpt) ? ' selected' : '';
        html += '<option value="' + opt.optionId + '"' + selected + '>' + label + '</option>';
      });
      html += '</select></td>';
    }

    html += '<td><button class="btn btn-sm btn-primary" onclick="saveUserDefaultRow(\'' +
            empId + '\')">保存</button></td>';
    html += '</tr>';
  });

  html += '</tbody></table>';
  document.getElementById('defaults-table-container').innerHTML = html;
}

function saveUserDefaultRow(employeeId) {
  var selects = document.querySelectorAll('select.default-select[data-emp="' + employeeId + '"]');
  var defaults = {};
  selects.forEach(function(sel) {
    var day = sel.dataset.day;
    defaults[day] = sel.value;
  });

  showLoading();
  google.script.run
    .withSuccessHandler(function(result) {
      hideLoading();
      showToast(result.message, result.success ? 'success' : 'error');
    })
    .withFailureHandler(handleError)
    .apiAdminSaveUserDefaults(currentToken, employeeId, defaults);
}

// ========== 自動生成（デフォルトから） ==========
function generateAllRequestsFromDefaults() {
  var yearMonth = document.getElementById('input-month-select').value;
  if (!yearMonth) return;

  // まず既存の希望がデフォルトと異なるかチェック
  showLoading();
  google.script.run
    .withSuccessHandler(function(checkResult) {
      hideLoading();
      if (!checkResult.success) {
        showToast(checkResult.message, 'error');
        return;
      }

      var msg = yearMonth + ' の希望シフトをデフォルト設定から全ユーザー一括反映しますか？';
      if (checkResult.hasModified) {
        msg += '\n\n[警告] デフォルトと異なる希望が ' + checkResult.modifiedCount + ' 件あります。上書きされます。';
      } else if (checkResult.requestCount > 0) {
        msg += '\n既存の希望は上書きされます。';
      }

      if (!confirm(msg)) return;

      showLoading();
      google.script.run
        .withSuccessHandler(function(result) {
          hideLoading();
          if (result.success) {
            showToast('デフォルトから反映しました（' + result.count + '件）', 'success');
            loadShiftInput();
          } else {
            showToast(result.message, 'error');
          }
        })
        .withFailureHandler(handleError)
        .apiAdminGenerateAllRequestsFromDefaults(currentToken, yearMonth);
    })
    .withFailureHandler(handleError)
    .apiAdminCheckRequestsVsDefaults(currentToken, yearMonth);
}

// ========== 管理者：Excel出力 ==========
function exportExcel() {
  var yearMonth = document.getElementById('export-month-select').value;
  if (!yearMonth) {
    showToast('対象年月度を選択してください', 'error');
    return;
  }

  document.getElementById('export-result').innerHTML = '<div class="loading">ファイル作成中...</div>';
  showLoading();

  google.script.run
    .withSuccessHandler(function(result) {
      hideLoading();
      if (result.success) {
        // base64からBlobを作成してダウンロード
        var byteChars = atob(result.base64);
        var byteNumbers = new Array(byteChars.length);
        for (var i = 0; i < byteChars.length; i++) {
          byteNumbers[i] = byteChars.charCodeAt(i);
        }
        var byteArray = new Uint8Array(byteNumbers);
        var blob = new Blob([byteArray], {type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = result.fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        document.getElementById('export-result').innerHTML =
          '<div class="notice notice-success">' + result.message + '</div>';
      } else {
        document.getElementById('export-result').innerHTML =
          '<div class="notice notice-danger">' + result.message + '</div>';
      }
    })
    .withFailureHandler(function(err) {
      hideLoading();
      document.getElementById('export-result').innerHTML =
        '<div class="notice notice-danger">エラー: ' + err.message + '</div>';
    })
    .apiAdminCreateExcelFile(currentToken, yearMonth);
}

// ========== 管理者：周知事項 ==========
function loadAnnouncements() {
  document.getElementById('announcements-table-container').innerHTML = '<div class="loading">読み込み中...</div>';
  google.script.run
    .withSuccessHandler(function(result) {
      if (!result.success) return;
      var html = '<table class="admin-table"><thead><tr><th>年月度</th><th>内容</th><th>操作</th></tr></thead><tbody>';
      result.announcements.forEach(function(a, idx) {
        html += '<tr><td>' + a.yearMonth + '</td><td>' + (a.message || '').substring(0, 50) + '</td>';
        html += '<td><button class="btn btn-sm btn-primary" data-anno-idx="' + idx + '">編集</button></td></tr>';
      });
      // 編集ボタンのイベント設定用にデータを保存
      window._announcementsData = result.announcements;
      html += '</tbody></table>';
      document.getElementById('announcements-table-container').innerHTML = html;
      // 編集ボタンにイベントリスナーを設定
      document.querySelectorAll('[data-anno-idx]').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var a = window._announcementsData[parseInt(btn.dataset.annoIdx)];
          editAnnouncement(a.yearMonth, a.message || '');
        });
      });
    })
    .withFailureHandler(handleError)
    .apiAdminGetAnnouncements(currentToken);
}

function editAnnouncement(yearMonth, message) {
  document.getElementById('anno-ym').value = yearMonth;
  document.getElementById('anno-message').value = message;
}

function saveAnnouncement() {
  var ym = document.getElementById('anno-ym').value;
  var msg = document.getElementById('anno-message').value;
  if (!ym) { showToast('年月度を選択してください', 'error'); return; }
  showLoading();
  google.script.run
    .withSuccessHandler(function(result) {
      hideLoading();
      showToast(result.message, result.success ? 'success' : 'error');
      if (result.success) loadAnnouncements();
    })
    .withFailureHandler(handleError)
    .apiAdminSaveAnnouncement(currentToken, ym, msg);
}

// ========== ユーティリティ ==========
function generateDates(startDate, endDate) {
  var dates = [];
  var current = new Date(startDate);
  var end = new Date(endDate);
  while (current <= end) {
    var y = current.getFullYear();
    var m = ('0' + (current.getMonth() + 1)).slice(-2);
    var d = ('0' + current.getDate()).slice(-2);
    dates.push(y + '-' + m + '-' + d);
    current.setDate(current.getDate() + 1);
  }
  return dates;
}

function closeModal(id) {
  document.getElementById(id).style.display = 'none';
}

function showError(id, msg) {
  var el = document.getElementById(id);
  el.textContent = msg;
  el.style.display = 'block';
}

function hideError(id) {
  var el = document.getElementById(id);
  el.style.display = 'none';
}

function showLoading() {
  document.getElementById('loading-overlay').style.display = 'flex';
}

function hideLoading() {
  document.getElementById('loading-overlay').style.display = 'none';
}

function handleError(err) {
  hideLoading();
  showToast('エラー: ' + err.message, 'error');
}

function showToast(message, type) {
  type = type || 'info';
  var container = document.getElementById('toast-container');
  var toast = document.createElement('div');
  toast.className = 'toast toast-' + type;
  toast.textContent = message;
  container.appendChild(toast);
  setTimeout(function() {
    toast.style.opacity = '0';
    toast.style.transition = 'opacity 0.3s';
    setTimeout(function() { toast.remove(); }, 300);
  }, 3000);
}
